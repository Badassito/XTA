[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xta"
dynamic = ["version"]
description = "Volume test-time, pretraining, and label-time augmentation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "numba>=0.61.2",
  "opencv-python",
  "scipy",
  "tifffile",
  "tqdm",
  "ultralytics>=8.4.128,<8.5",
]

[project.optional-dependencies]
openvino = ["openvino"]
cuda12 = ["cupy-cuda12x>=13.0", "nvidia-ml-py"]
cuda13 = ["cupy-cuda13x>=13.0", "nvidia-ml-py"]
nvtiff12 = ["nvidia-nvtiff-cu12>=0.8"]
nvtiff13 = ["nvidia-nvtiff-cu13>=0.8"]
acceleration = ["deflate>=0.9.0", "isal"]
pta = ["pynrrd", "albumentations"]
lta = ["pynrrd"]

[project.scripts]
xta = "XTA.cli:run"

[tool.setuptools.packages.find]
include = ["XTA*"]

[tool.setuptools.dynamic]
version = {attr = "XTA.__version__"}

[tool.setuptools.package-data]
"XTA.examples.external_augmentations" = ["README.md"]
"XTA.examples.external_reconciliation" = ["README.md"]

[tool.setuptools.data-files]
"share/xta" = [
  "ARCHITECTURE.md",
  "GPT-6-Astra-Ultra_v24.1.1_SLURM.py",
]
"share/xta/docs" = ["docs/sam_interpolation.md", "docs/lta_dynamic_crops.md", "docs/projection_coverage.md"]
