[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xta"
version = "22.0.0"
description = "Volume test-time, pretraining, and label-time augmentation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "tifffile",
  "tqdm",
  "ultralytics",
]

[project.optional-dependencies]
openvino = ["openvino"]
cuda12 = ["cupy-cuda12x>=13.0", "nvidia-ml-py"]
cuda13 = ["cupy-cuda13x>=13.0", "nvidia-ml-py"]
nvtiff12 = ["nvidia-nvtiff-cu12>=0.8"]
nvtiff13 = ["nvidia-nvtiff-cu13>=0.8"]
acceleration = ["numba", "deflate", "isal"]
pta = ["pynrrd", "albumentations"]
lta = ["pynrrd"]

[project.scripts]
xta = "XTA.cli:run"

[tool.setuptools.packages.find]
include = ["XTA*"]

[tool.setuptools.package-data]
"XTA.examples.external_augmentations" = ["README.md"]

[tool.setuptools.data-files]
"share/xta" = [
  "ARCHITECTURE.md",
  "GPT-6-Astra-Ultra_v22.0.0_SLURM.py",
]
"share/xta/tools" = [
  "tools/tta_augmentation_smoke.py",
  "tools/check_tta_augmentation_run.py",
  "tools/benchmark_tta_augmentation.py",
  "tools/qualify_tta_augmentation.py",
  "tools/certify_qsc_lipschitz.py",
  "tools/plan_projection_sampling.py",
  "tools/replay_component_projection.py",
  "tools/hgx_selftest.py",
  "tools/d1_ipc_selftest.py",
  "tools/lta_gpu_smoke.py",
  "tools/lta_point_smoke.py",
  "tools/lta_tile_smoke.py",
  "tools/lta_mask_seed_smoke.py",
  "tools/lta_full_volume.py",
  "tools/lta_tracklet_pair.py",
  "tools/lta_production_smoke.py",
  "tools/lta_worker_profile.py",
  "tools/lta_tracker_feature_smoke.py",
  "tools/lta_trace_summary.py",
  "tools/lta_host_io_profile.py",
  "tools/lta_host_pipeline_smoke.py",
  "tools/lta_window_gpu_smoke.py",
  "tools/lta_overlap_profile.py",
  "tools/lta_relay_frontier_smoke.py",
]
